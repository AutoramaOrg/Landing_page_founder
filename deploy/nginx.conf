worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Do not log query strings containing payment identifiers.
    log_format minimal '$request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout minimal;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://nmenoqjgjtrpvowguvlg.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
        location ~ /\. { deny all; }
        # Builds do jogo montadas do host (somente leitura), fora da imagem; sem listagem.
        location /downloads/ {
            limit_except GET HEAD { deny all; }
            alias /usr/share/nginx/downloads/;
            types {
                application/vnd.android.package-archive apk;
                application/json json;
            }
        }
        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/ =404;
        }
    }
}
